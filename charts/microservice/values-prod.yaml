env: { APP_ENV: prod }
replicaCount: 3
strategy: bluegreen
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
pdb: { minAvailable: 2 }
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits:   { cpu: 1,    memory: 512Mi }
image:
  # service: node-service
  tag: "prod"
