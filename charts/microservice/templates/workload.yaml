{{- if eq .Values.strategy "bluegreen" }}
# Blue-green via Argo Rollouts: new ReplicaSet is previewed before traffic is promoted.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.name }}
  labels: {{- include "ms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ .Values.name }} }
  strategy:
    blueGreen:
      activeService: {{ .Values.name }}
      previewService: {{ .Values.name }}-preview
      autoPromotionEnabled: {{ ternary "false" "true" (eq .Values.env.APP_ENV "prod") }}
      scaleDownDelaySeconds: 300
  template:
    metadata:
      labels: {{- include "ms.labels" . | nindent 8 }}
    spec:
      {{- include "ms.podSpec" . | nindent 6 }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels: {{- include "ms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ .Values.name }} }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: {{- include "ms.labels" . | nindent 8 }}
    spec:
      {{- include "ms.podSpec" . | nindent 6 }}
{{- end }}
